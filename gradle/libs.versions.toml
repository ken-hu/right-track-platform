[versions]
springboot = "3.3.5"
spring-cloud = "2023.0.3"
alibaba-spring-cloud = "2023.0.1.0"
springdoc = "2.6.0"
guava = "32.0.1-android"
common-lang3 = "3.12.0"
common-io = "1.3.2"
mapstruct = "1.5.3.Final"
druid = "1.2.15"
nimbusds = "10.4"
oauth2-jose = "5.7.6"
postgresql-driver = "42.7.2"
hibernate-types-55 = "2.21.1"
spring-security-authorizationserver = "1.0.1"
p6spy = "3.9.1"
mybatis-starter = "3.5.7"
jnanoid = "2.0.0"
pbac-spring-boot-starter = "1.0.0-SNAPSHOT"
storage-oss = "3.8.0"
storage-obs = "3.22.12"

[libraries]

#Custom Project
"pbac-spring-boot-starter" = { group = "pers.ken.rt", name = "pbac-spring-boot-starter", version.ref = "pbac-spring-boot-starter" }

#springBoot
"springboot-dependencies" = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "springboot" }
"springboot-web" = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
"springboot-autoconfigure" = { group = "org.springframework.boot", name = "spring-boot-autoconfigure" }
"springboot-aop" = { group = "org.springframework.boot", name = "spring-boot-starter-aop" }
"springboot-webflux" = { group = "org.springframework.boot", name = "spring-boot-starter-webflux" }
"springboot-data-jpa" = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
"springboot-validation" = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
"springboot-devtools" = { group = "org.springframework.boot", name = "spring-boot-devtools" }
"springboot-actuator" = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
"springboot-oauth2-resourceserver" = { group = "org.springframework.boot", name = "spring-boot-starter-oauth2-resource-server" }
"springboot-data-redis" = { group = "org.springframework.boot", name = "spring-boot-starter-data-redis" }
"spring-session-redis" = { group = "org.springframework.session", name = "spring-session-data-redis" }
"springboot-oauth2-client" = { group = "org.springframework.boot", name = "spring-boot-starter-oauth2-client" }
"spring-security-authorizationserver" = { group = "org.springframework.security", name = "spring-security-oauth2-authorization-server" }
"springboot-security" = { group = "org.springframework.boot", name = "spring-boot-starter-security" }
"springboot-configuration-processor" = { group = "org.springframework.boot", name = "spring-boot-configuration-processor" }
"springboot-test" = { group = "org.springframework.boot", name = "spring-boot-starter-test" }

#springCloud
"springcloud-dependencies" = { group = "org.springframework.cloud", name = "spring-cloud-dependencies", version.ref = "spring-cloud" }
"springcloud-openfeign" = { group = "org.springframework.cloud", name = "spring-cloud-starter-openfeign" }
"springcloud-gateway" = { group = "org.springframework.cloud", name = "spring-cloud-starter-gateway" }
"springcloud-loadbalancer" = { group = "org.springframework.cloud", name = "spring-cloud-starter-loadbalancer" }
"springcloud-bootstrap" = { group = "org.springframework.cloud", name = "spring-cloud-starter-bootstrap" }
"springcloud-alibaba-dependencies" = { group = "com.alibaba.cloud", name = "spring-cloud-alibaba-dependencies", version.ref = "alibaba-spring-cloud" }
"springcloud-alibaba-sentinel-gateway" = { group = "com.alibaba.cloud", name = "spring-cloud-alibaba-sentinel-gateway" }
"springcloud-alibaba-sentinel" = { group = "com.alibaba.cloud", name = "spring-cloud-starter-alibaba-sentinel" }
"springcloud-alibaba-nacos-discovery" = { group = "com.alibaba.cloud", name = "spring-cloud-starter-alibaba-nacos-discovery" }
"springcloud-alibaba-nacos-config" = { group = "com.alibaba.cloud", name = "spring-cloud-starter-alibaba-nacos-config" }

#springDoc
"springdoc-openapi" = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
"springdoc-openapi-webflux" = { group = "org.springdoc", name = "springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }

#utils
"lombok" = { group = "org.projectlombok", name = "lombok" }
"google-guava" = { group = "com.google.guava", name = "guava", version.ref = "guava" }
"mapstruct" = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct" }
"mapstruct-processor" = { group = "org.mapstruct", name = "mapstruct-processor", version.ref = "mapstruct" }
"apache-common-lang3" = { group = "org.apache.commons", name = "commons-lang3", version.ref = "common-lang3" }
"apache-common-io" = { group = "org.apache.commons", name = "commons-io", version.ref = "common-io" }
"hibernate-types55" = { group = "com.vladmihalcea", name = "hibernate-types-55", version.ref = "hibernate-types-55" }
"mybatis-starter" = { group = "com.baomidou", name = "mybatis-plus-spring-boot3-starter", version.ref = "mybatis-starter" }
"jnanoid" = { group = "com.aventrix.jnanoid", name = "jnanoid", version.ref = "jnanoid" }

#database
"postgresql" = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql-driver" }
"alibaba-druid" = { group = "com.alibaba", name = "druid", version.ref = "druid" }
"p6spy" = { group = "p6spy", name = "p6spy", version.ref = "p6spy" }

#cloudPlatformDenpendency
"storage-oss" = { group = "com.aliyun.oss", name = "aliyun-sdk-oss", version.ref = "storage-oss" }
"storage-obs" = { group = "com.huaweicloud", name = "esdk-obs-java-bundle", version.ref = "storage-obs" }
