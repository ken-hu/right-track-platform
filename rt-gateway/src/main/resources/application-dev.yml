server:
  port: 38080
  servlet:
    session:
      cookie:
        # 需要更换存放sessionId的cookie名字，否则认证服务和客户端的sessionId会相互覆盖
        name: JSESSIONID-2
spring:
  config:
    activate:
      on-profile: dev
  application:
    name: gateway
  security:
    oauth2:
      client:
        provider:
          channel:
            #            issuer-uri: 'http://api-uc.ken.com'
            # 发起授权申请的地址
            authorization-uri: http://uc.ken.com/api/oauth2/authorize
            # 获取token的地址
            token-uri: http://uc.ken.com/api/oauth2/token
            # 获取用户信息的地址
            user-info-uri: http://uc.ken.com/api/v1/users/me
            jwk-set-uri: http://uc.ken.com/api/oauth2/jwks
            user-name-attribute: "account_id"
        registration:
          channel:
            provider: channel
            client-name: 'channel'
            client-id: 'channel'
            client-secret: 'GzVBhcAx2tYvQxmcjWhV'
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: 'http://app.ken.com/api/login/oauth2/code/channel'
            scope:
              - read
      resourceserver:
        jwt:
          issuer-uri: 'http://uc.ken.com'
          jwk-set-uri: 'http://uc.ken.com/api/oauth2/jwks'
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      config:
        file-extension: yaml
        server-addr: 127.0.0.1:8848
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: mall-service
          uri: lb://mall
          predicates:
            - Path=/mall/api/**
          filters:
            - RewritePath=/mall/api/(?<path>.*), /$\{path}
        - id: map-service
          uri: lb://map
          predicates:
            - Path=/map/api/**
          filters:
            - RewritePath=/map/api/(?<path>.*), /$\{path}
logging:
  file:
    path: ./logs

springdoc:
  api-docs:
    enabled: true
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    display-operation-id: true

